# Job radar configuration.
# Everything here is tunable without touching the code.

run:
  # Hard ceiling on HTTP requests per run. LinkedIn throttles a single IP after
  # roughly ten rapid pages, so the budget stays well under that.
  max_requests: 80
  # Random delay between requests, in seconds.
  delay_range: [1.0, 3.0]
  timeout: 15
  # Stay silent for this long after the ledger is created. LinkedIn returns a
  # different slice of its backlog on every call, so the first day of runs keeps
  # turning up older postings that are new only to the ledger. Once the window
  # closes, anything new really is new.
  warmup_hours: 24

sources:
  linkedin:
    enabled: true
    # Pages per query. The endpoint serves 10 per page and dries up past 40.
    pages_per_query: 3
    # Look back 24h. Deduplication removes repeats, so the wide window simply
    # covers any scheduled run that GitHub delayed or skipped.
    time_filter: r86400

    queries:
      # --- Turkey (primary) ---
      - { label: "TR/frontend",   keywords: "frontend developer",  geo_id: 102105699 }
      - { label: "TR/front-end",  keywords: "front end developer", geo_id: 102105699 }
      - { label: "TR/fullstack",  keywords: "fullstack developer", geo_id: 102105699 }
      - { label: "TR/full-stack", keywords: "full stack developer", geo_id: 102105699 }
      - { label: "TR/react",      keywords: "react developer",     geo_id: 102105699 }
      - { label: "TR/swe",        keywords: "software engineer",   geo_id: 102105699 }
      - { label: "TR/ai",         keywords: "ai engineer",         geo_id: 102105699 }

      # --- Global (secondary) ---
      # geo_id 92000000 is LinkedIn's worldwide scope. Note that f_WT (the remote
      # filter) is deliberately absent: the guest endpoint accepts the parameter
      # but ignores it, so remote is detected from the posting text instead.
      - { label: "GL/frontend",   keywords: "frontend developer remote",  geo_id: 92000000 }
      - { label: "GL/fullstack",  keywords: "fullstack developer remote", geo_id: 92000000 }
      - { label: "GL/react",      keywords: "react developer remote",     geo_id: 92000000 }

  # Public ATS job boards. These are documented, unauthenticated JSON endpoints
  # that companies use to embed openings on their own sites -- not scraping.
  # They publish a role as soon as it goes live, typically one to three days
  # before LinkedIn's crawler indexes it, which is the whole reason they matter.
  #
  # Every slug below was verified to return live postings. To add a company,
  # find its board URL: jobs.lever.co/<slug>, boards.greenhouse.io/<slug>,
  # or jobs.ashbyhq.com/<slug>.
  ats:
    enabled: true
    # These boards return their full catalogue, including years-old postings.
    max_age_days: 7

    companies:
      # --- Turkey ---
      - { board: lever,      slug: dreamgames }
      - { board: lever,      slug: picus }

      # --- Global, remote-friendly ---
      - { board: greenhouse, slug: vercel }
      - { board: greenhouse, slug: gitlab }
      - { board: greenhouse, slug: cloudflare }
      - { board: greenhouse, slug: figma }
      - { board: greenhouse, slug: doximity }
      - { board: ashby,      slug: linear }
      - { board: ashby,      slug: supabase }
      - { board: ashby,      slug: posthog }

scoring:
  # A job is notified when its score reaches this threshold. Anything lower is
  # still archived to data/jobs.jsonl, it just does not buzz the phone.
  notify_threshold: 4

  # Matched against title + location only. Descriptions are deliberately excluded:
  # ATS sources carry one and LinkedIn does not, so including them would score the
  # same job differently depending on where it arrived from.

  # Role terms are the primary relevance signal -- what the job actually is.
  # At least one must match before any bonus or freshness point is awarded.
  role:
    frontend: 3
    "front end": 3
    fullstack: 3
    "full stack": 3
    react: 3
    "react native": 2
    "next.js": 3
    nextjs: 3
    javascript: 2
    node: 2
    vue: 1
    angular: 1
    "ai engineer": 3
    llm: 3
    "generative ai": 3

  # Bonus terms only refine an already-relevant job. "remote" describes how you
  # work, not what the job is; on its own it must never carry a posting over the
  # threshold, or every "Senior Engagement Manager, Remote" would be notified.
  bonus:
    remote: 4
    uzaktan: 4
    hybrid: 1
    typescript: 3
    tailwind: 1
    openai: 2

  negative:
    # Different stack entirely.
    ".net": -5
    "c#": -5
    php: -5
    laravel: -5
    wordpress: -5
    # Whole-word matching means "java" cannot fire on "javascript".
    java: -4
    j2ee: -4
    spring: -3
    android: -3
    ios: -3
    # Wrong role family.
    qa: -4
    tester: -4
    "test engineer": -4
    devops: -3
    sales: -6
    marketing: -6
    recruiter: -6
    # Wrong seniority.
    intern: -3
    stajyer: -3
    "10+ years": -2
    "director": -3
    "head of": -3

  # Disqualifying terms. Unlike a negative weight, a veto cannot be outscored by
  # positive matches -- it removes the job from notifications outright. Use this
  # for "never show me this" cases; use negative weights for "counts against it".
  veto:
    - ".net"
    - "c#"
    - php
    - laravel
    - wordpress
    - java
    - j2ee
    - sales
    - marketing
    - recruiter
    - intern
    - stajyer

  # Bonus by posting age in days, applied only when a job already matched at
  # least one positive term. Freshness breaks ties; it is not evidence of fit.
  freshness:
    0: 3
    1: 1

telegram:
  # Token and chat id come from the environment (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID),
  # never from this file.
  enabled: true
  # Safety valve: never send more than this many cards in one run.
  max_notifications_per_run: 15
